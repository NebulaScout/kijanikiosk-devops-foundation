apiVersion: apps/v1
kind: Deployment
metadata:
  name: kk-payments
  annotations:
    kubernetes.io/change-cause: "Update kk-payments to v1.1.0: fix payment processing latency"
  labels:
    app: kk-payments
    component: payments
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: kk-payments
  template:
    metadata:
      labels:
        app: kk-payments
        component: payments
    spec:
      imagePullSecrets:
        - name: kijani-registry-credentials
      containers:
        - name: kk-payments
          image: docker.io/nebulascout/kijani-kiosk:1.1.0-8a9b2c3
          ports:
            - containerPort: 3001
              protocol: TCP
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe: # Controls Traffic Routing
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe: # Controls Pod Restart
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: kk-payments-config
      restartPolicy: Always