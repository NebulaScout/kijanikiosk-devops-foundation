apiVersion: apps/v1
kind: Deployment
metadata:
  name: kk-payments
  labels:
    app.kubernetes.io/name: kk-payments
    app.kubernetes.io/component: payments
    app.kubernetes.io/part-of: kijani-kiosk
spec:
  replicas: 3
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kk-payments
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kk-payments
        app.kubernetes.io/component: payments
        app.kubernetes.io/part-of: kijani-kiosk
    spec:
      imagePullSecrets:
        - name: kijani-registry-credentials
      containers:
        - name: kk-payments
          image: docker.io/nebulascout/kk-payments:v1.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: kk-payments-config
            - secretRef:
                name: kk-payments-secrets
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 500m
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
